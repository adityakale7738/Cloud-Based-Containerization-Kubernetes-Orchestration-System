# ==============================================================================
# Alternative Service Manifest: NodePort (Optional for Browser Playgrounds)
# Use this when running on Killercoda or Play-with-Kubernetes to expose port 30080
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: cloud-demo-nodeport-service
  labels:
    app: cloud-demo
    tier: frontend
spec:
  type: NodePort
  selector:
    app: cloud-demo
  ports:
    - name: http
      protocol: TCP
      port: 80           # Internal ClusterIP port
      targetPort: 5000   # Container port
      nodePort: 30080    # Static port opened on each Kubernetes worker node
