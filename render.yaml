services:
  - type: web
    name: cloud-demo-app
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: APP_VERSION
        value: 1.0.0
      - key: ENVIRONMENT
        value: Render Cloud Production
      - key: LOG_LEVEL
        value: INFO
